<dialog id="zoom-overlay" class="zoom-overlay" aria-label="Image viewer" aria-describedby="zoom-caption">
    <div class="zoom-overlay__toolbar">
        <button type="button" class="zoom-overlay__close" aria-label="Close image viewer" autofocus>Close ×</button>
    </div>
    <div class="zoom-overlay__viewport" role="region" aria-label="Enlarged image">
        <div class="zoom-overlay__media"></div>
    </div>
    <p id="zoom-caption" class="zoom-overlay__caption"></p>
</dialog>
