{% if reading_list.quotes %}
<section aria-labelledby="reading-quotes">
<h2 id="reading-quotes">Quotes</h2>
{% for quote in reading_list.quotes %}
<div class="quote-wrapper">
<div class="quote-content">{{ quote.text|e }}</div>
<div class="quote-author">— {{ quote.author|e }}{% if quote.book %}, <cite>{{ quote.book|e }}</cite>{% endif %}</div>
<a href="{{ quote.url|e }}" target="_blank" rel="noopener noreferrer">View on Goodreads</a>
</div>
{% endfor %}
</section>
{% endif %}
