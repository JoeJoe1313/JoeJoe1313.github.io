{% for shelf in reading_list.shelves %}
<section class="bookshelf" aria-labelledby="shelf-{{ shelf.name|e }}">
<h2 id="shelf-{{ shelf.name|e }}">{{ shelf.title|e }}</h2>
{% for book in shelf.books %}
<div class="book-item">
{% if book.cover or book.cover_url %}
<a href="{{ book.url|e }}" target="_blank" rel="noopener noreferrer">
<img class="book-cover" src="{% if book.cover %}{static}/{{ book.cover|e }}{% else %}{{ book.cover_url|e }}{% endif %}" width="120" alt="Cover of {{ book.title|e }}" loading="lazy" decoding="async">
</a>
{% endif %}
<div class="book-details">
<header><a href="{{ book.url|e }}" target="_blank" rel="noopener noreferrer">{{ book.title|e }}</a></header>
<p>by {{ book.author|e }}</p>
</div>
</div>
{% else %}
<p>No books on this shelf at the moment.</p>
{% endfor %}
</section>
{% endfor %}
